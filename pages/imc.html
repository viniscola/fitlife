    <main>
      <section>
        <h3>IMC</h3>
        <p>Em breve você poderá calcular seu IMC aqui</p>

        <form action="">
          <div>
            <label for="weight">Peso (kg)</label>
            <input type="number" placeholder="Ex: 70" id="weight" />
          </div>

          <div>
            <label for="height">Altura (m)</label>
            <input type="number" placeholder="Ex: 1.7" id="height" />
          </div>

          <button>Calcular</button>
        </form>

        <div>
          <p>Seu IMC é:</p>
          <p>00.0</p>
          <p>Classificação</p>
        </div>

        <a href="../index.html">Voltar</a>
      </section>
    </main>

    <footer>
      <p>© 2026 FitLife</p>
    </footer>
